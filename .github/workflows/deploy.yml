name: Deploy

# Build the image (with the plugin baked in), push it to GHCR, deploy to the
# target EC2 host over SSH, and (on dev) gate on the QA smoke suite.
#
#   push to dev / plugin-updated -> environment "development" -> tag :dev  -> smoke gate, rollback on failure
#   push to main                 -> environment "production"  -> tag :prod + :latest
#
# Forks: set repo variable COMPOSE_SERVICE to enable the deploy job, and
# QA_REPO (repo name, same owner) to enable the smoke gate. PLUGIN_REPO defaults to
# <owner>/ids-drr-india-plugin.

on:
  push:
    branches: [dev, main]
  # Sent by the plugin repo on push to main; runs on the default branch (dev).
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENV_TAG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.PLUGIN_REPO || format('{0}/ids-drr-india-plugin', github.repository_owner) }}
          ref: ${{ vars.PLUGIN_REF || 'main' }}
          path: ids-drr-india-plugin

      # ghcr.io image paths must be lowercase. The repository slug is mixed-case.
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # https://github.com/docker/login-action#github-container-registry
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/setup-buildx-action#usage
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # https://github.com/docker/build-push-action#usage
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          file: Dockerfile
          build-args: PLUGIN_PACKAGE=ids-drr-india-plugin
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.ENV_TAG }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: vars.COMPOSE_SERVICE != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Pull, migrate & restart on host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TOKEN,REG_USER,DEPLOY_PATH,SERVICE,IMAGE,ENV_TAG
          script: |
            set -euo pipefail
            echo "$TOKEN" | sudo docker login ghcr.io -u "$REG_USER" --password-stdin
            cd "$DEPLOY_PATH"
            # Keep the running image so the rollback job can restore it.
            running=$(sudo docker compose images -q "$SERVICE" | head -1)
            [ -n "$running" ] && sudo docker tag "$running" "$IMAGE:rollback"
            sudo IMAGE_TAG="$ENV_TAG" docker compose pull "$SERVICE"
            # The container entrypoint does not run migrations.
            sudo IMAGE_TAG="$ENV_TAG" docker compose run --rm "$SERVICE" python manage.py migrate --noinput
            sudo IMAGE_TAG="$ENV_TAG" docker compose up -d --no-build "$SERVICE"
            sudo docker image prune -f
            sudo docker logout ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ vars.COMPOSE_SERVICE }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}

  dev-smoke:
    name: Smoke (dev)
    needs: deploy
    if: github.ref == 'refs/heads/dev' && vars.QA_REPO != ''
    runs-on: ubuntu-latest
    steps:
      # Triggers the QA repo's dispatch.yml and blocks until it finishes; this
      # job (and its check) is green only if smoke passes.
      - uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ vars.QA_REPO }}
          github_token: ${{ secrets.QA_REPO_PAT }}
          workflow_file_name: dispatch.yml
          ref: main
          wait_interval_seconds: 30
          client_payload: '{"scope":"smoke","target_env":"dev"}'

  rollback-dev:
    name: Roll back dev
    needs: [build-and-push, dev-smoke]
    if: failure() && needs.dev-smoke.result == 'failure'
    runs-on: ubuntu-latest
    environment: development
    steps:
      # Restores the previous image only; migrations already applied stay.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_PATH,SERVICE,IMAGE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            sudo docker tag "$IMAGE:rollback" "$IMAGE:dev"
            sudo IMAGE_TAG=dev docker compose up -d --no-build "$SERVICE"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ vars.COMPOSE_SERVICE }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
